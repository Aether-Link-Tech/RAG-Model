name: Backend tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping=1"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 60s
          --health-retries 12

    env:
      CI: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_db
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install small; requirements then reuse it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: Build parser sandbox image
        run: docker build -t rag-parser-sandbox:latest docker/parser

      - name: Run migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Isolation suite (TC-ISO-01..10, RLS guard, integrity check)
        working-directory: backend
        run: python -m pytest tests -m isolation -v

      - name: Full test suite
        working-directory: backend
        run: python -m pytest tests -v
