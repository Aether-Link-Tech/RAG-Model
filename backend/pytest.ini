[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    clamav_scan: test exercises the real ClamAV scan integration
    isolation: cross-user isolation test (TC-ISO suite, RLS guard); run with -m isolation
    tc_iso(case_id): the TC-ISO-01..10 case a test belongs to (see tests/isolation_catalog.py)
